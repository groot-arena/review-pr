name: 'Publish Versioned Release'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version tag to publish (e.g. v1.0.0)'
        required: true
        type: string
        default: 'v1.0.0'
      update-major-tag:
        description: 'Update moving major version tag (e.g. v1)'
        required: false
        type: boolean
        default: true
      release-notes:
        description: 'Optional release notes description'
        required: false
        type: string
        default: 'Production release of CI PR verification workflow.'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build dist/ and Tag Release
    runs-on: ubuntu-latest
    environment: release # Allows requiring manual approval via GitHub Environment Protection Rules
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript Compilation Check
        run: npm run typecheck

      - name: ESLint Static Analysis
        run: npm run lint

      - name: Build Standalone dist/ Bundles
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Commit dist/ and Tag Release
        env:
          VERSION: ${{ inputs.version }}
          UPDATE_MAJOR: ${{ inputs.update-major-tag }}
          NOTES: ${{ inputs.release-notes }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force-add dist/ to the release tag so consumers have self-contained bundles
          git add -f dist/
          git commit -m "chore(release): build bundles for $VERSION [skip ci]"

          # Create semantic version tag
          git tag -fa "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION" --force

          # Update floating major version tag (e.g. v1) if requested
          if [ "$UPDATE_MAJOR" = "true" ]; then
            MAJOR_TAG=$(echo "$VERSION" | cut -d. -f1)
            git tag -fa "$MAJOR_TAG" -m "Point $MAJOR_TAG to $VERSION"
            git push origin "$MAJOR_TAG" --force
            echo "Updated major tag $MAJOR_TAG -> $VERSION"
          fi

          # Create GitHub Release with auto-generated release notes
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --notes "$NOTES" \
            --generate-notes \
            --verify-tag
